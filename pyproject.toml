[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wsu-canvas-tools"
version = "0.1.0"
description = "Canvas API and local course mirror CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "tabulate>=0.9",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]
zoom = ["browser-cookie3>=0.19", "playwright>=1.40"]

[project.scripts]
canvascli = "canvascli.commands:main"

[tool.setuptools.packages.find]
include = ["canvasapi*", "canvascli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
